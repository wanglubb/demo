spring.application.name=demo

# 应用版本（IDE 直接运行读此值；Gradle processResources 会按 build.gradle 的 version 覆盖）
app.version=0.0.8-SNAPSHOT

# 服务器配置
server.port=8080
server.servlet.context-path=/

# Session配置
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=DEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# 日志配置
logging.level.com.tools.demo=INFO
logging.level.org.springframework.web=DEBUG

# 编码配置
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Redis配置
spring.data.redis.host=8.163.1.140
spring.data.redis.port=6379
spring.data.redis.password=admin123
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
# 连接池配置
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms